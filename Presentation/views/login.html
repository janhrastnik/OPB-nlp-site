%rebase('main.html')

<title>Login</title>

<style>
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background-color: #111;
    border: 2px solid #97FEED;
    border-radius: 8px;
    color: #97FEED;
    font-size: 14px;
  }

  input:focus {
    outline: none;
    border-color: #97FEED;
    box-shadow: 0 0 10px #97FEED;
  }
</style>

<div class="content-page">
  <div class="content-container">
    <h2>Login</h2>
    <form action="/do_login" method="post">
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="alien-btn">Sign In</button>
    </form>
    <a href="/register"><button class="alien-btn">Register</button></a>
  </div>
</div>
