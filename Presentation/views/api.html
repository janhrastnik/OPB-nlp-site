%rebase('main.html')

    border-radius: 15px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    max-width: 500px;
  }

  h1 {
    font-family: "Orbitron", sans-serif;
    font-size: 2.2em;
    color: #00ffff;
    margin-bottom: 20px;
  }

  .profile-info {
    font-size: 1.1em;

    line-height: 1.8;
  }
</style>

  <div class="content-container">

          fetch("/get_all_sightings")
            .then((res) => res.text())
            .then((text) => {
              console.log(text);
            });
        }
        function getAllUsers() {
          fetch("/get_all_users").then((res) => {
            // here we could do something with the data
            void 0;
          });

    </div>
  </div>
</div>
