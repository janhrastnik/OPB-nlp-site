%rebase('main.html')

<title>Registration</title>
<style>
  h2 {
    margin-bottom: 24px;
    text-shadow: 0 0 10px #0ff;
  }

  input[type="email"],
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background-color: #111;
    border: 2px solid #0ff;
    border-radius: 8px;
    color: #0ff;
    font-size: 14px;
  }

  input:focus {
    outline: none;
    border-color: #00ffff;
    box-shadow: 0 0 10px #00ffff;
  }

  .register-btn {
    width: 100%;
    padding: 12px;
    margin-top: 16px;
    background-color: #0ff;
    color: #000;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 10px #0ff, 0 0 20px #0ff inset;
  }

  .register-btn:hover {
    background-color: #00cccc;
    box-shadow: 0 0 20px #0ff, 0 0 30px #0ff inset;
  }

  .login-link {
    display: inline-block;
    margin-top: 20px;
    color: #0ff;
    text-decoration: none;
    border: 1px solid #0ff;
    padding: 10px 20px;
    border-radius: 8px;
    transition: 0.3s;
  }

  .login-link:hover {
    background-color: #0ff;
    color: #000;
    box-shadow: 0 0 15px #0ff;
  }
</style>

<div class="content-page">
  <div class="content-container">
    <h2>Alien Registration</h2>
    <form action="/do_register" method="POST">
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="text" name="nickname" placeholder="Nickname" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="alien-btn">Register</button>
    </form>
    <a href="/login"><button class="alien-btn">Back to Login</button></a>
  </div>
</div>
