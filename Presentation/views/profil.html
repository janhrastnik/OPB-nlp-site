%rebase('main.html')

<title>My Profile</title>

<style>
  .profile-box {
    background-color: rgba(0, 0, 0, 0.75);
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    max-width: 500px;
  }

  .profile-info {
    font-size: 1.1em;
    color: #e0e0e0;
    line-height: 1.8;
  }
</style>

<div class="content-page">
  <div class="content-container w-50">
    <h2>My Profile</h2>
    <div class="profile-info">
      <p><strong>Username:</strong>{{username}}</p>
      <p><strong>Email:</strong> {{email}}</p>
      <p><strong>Number of Sightings:</strong> {{len(sightings)}}</p>
    </div>
  </div>

  <div class="content-container w-50">
    <h2>My Sightings</h2>
    <div>
      % for sighting in sightings:
        {{sighting}}
      % end
    </div>
    <a href="/add_sighting"><button class="alien-btn">Report new sighting</button></a>
  </div>

</div>
